name: Deploy SushiDay Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check data.js
          node --check app.js
          node --check admin.js
      - name: Run functional smoke tests
        run: |
          npm install --prefix /tmp/sushiday-smoke --no-save --no-audit --no-fund jsdom@26
          NODE_PATH=/tmp/sushiday-smoke/node_modules node tests/smoke.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
